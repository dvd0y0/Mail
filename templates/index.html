<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mail System</title>
<style>
body{
background:#0f172a;
font-family:Tahoma,sans-serif;
color:white;
}
.container{
width:500px;
margin:50px auto;
padding:30px;
border-radius:20px;
background:linear-gradient(145deg,#1e3a8a,#0f172a);
box-shadow:0 0 20px black;
}
input,textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border-radius:10px;
border:none;
}
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
}
</style>
</head>
<body>
<div class="container">
<h1>MAIL SYSTEM</h1>
<form method="POST">
<input type="text" name="name" placeholder="Ваше имя" required>
<textarea name="message" placeholder="Текст письма" required></textarea>
<input type="text" name="photo" placeholder="Ссылка на фото">
<button type="submit">Отправить</button>
</form>
{% if success %}
<h2>Сообщение отправлено!</h2>
{% endif %}
{% if error %}
<h2>{{ error }}</h2>
{% endif %}
</div>
</body>
</html>
